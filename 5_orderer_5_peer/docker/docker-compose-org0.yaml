version: '3.0'
#cli1

volumes:

  peer0.org0.com:
  couchdb0.org0.com:
  ca-org0:

networks:
  fabric-center:
    external: true

services:
  
  ca-org0:
    image: hyperledger/fabric-ca:1.5.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org0
      - FABRIC_CA_SERVER_CA_NAME=tlsca.org0.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/tls/peer/server.key
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/tls/peer/server.crt
      - FABRIC_CA_SERVER_TLS_CLIENTAUTH_TYPE
      - FABRIC_CA_SERVER_TLS_CERTFILES
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CFG_AFFILIATIONS_ALLOWREMOVE=true
      - FABRIC_CA_SERVER_CFG_IDENTITIES_ALLOWREMOVE=true
    ports:
      - "7054:7054"
    command: sh -c "fabric-ca-server start -b admin:adminpw -d"
    volumes:
      - ../organizations/crypto-config/peerOrganizations/org0.com/tlsca:/etc/hyperledger/fabric-ca-server
      - ../organizations/crypto-config/peerOrganizations/org0.com/peers/ca.org0.com/tls:/etc/hyperledger/tls/peer
      - ../organizations/crypto-config/peerOrganizations/org0.com/tlsca:/etc/hyperledger/tlsca

    container_name: ca-org0

    networks:
      - fabric-center

  couchdb0.org0.com:
    container_name: couchdb0.org0.com
    image: hyperledger/fabric-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    networks:
      - fabric-center

  peer0.org0.com:
    container_name: peer0.org0.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.org0.com
      - CORE_PEER_ADDRESS=peer0.org0.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org0.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org0.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org0.com:7051
      - CORE_PEER_LOCALMSPID=Org0MSP
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.org0.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_PEER_LIMITS_CONCURRENCY_GATEWAYSERVICE=100000

    depends_on:
      - couchdb0.org0.com
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations/crypto-config/peerOrganizations/org0.com/peers/peer0.org0.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/crypto-config/peerOrganizations/org0.com/peers/peer0.org0.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
      - 7052:7052
    networks:
      - fabric-center
