---
Organizations:

    - &OrdererOrg

        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: ./organizations/crypto-config/ordererOrganizations/com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP.admin')"
        OrdererEndpoints:
            - orderer0.com:7050
            - orderer1.com:7050
            - orderer2.com:7050
            - orderer3.com:7050
            - orderer4.com:7050


    - &Org0
        Name: Org0MSP
        ID: Org0MSP
        MSPDir: ./organizations/crypto-config/peerOrganizations/org0.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org0MSP.admin', 'Org0MSP.peer', 'Org0MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org0MSP.admin', 'Org0MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org0MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org0MSP.peer')"

        AnchorPeers:
            - Host: peer0.org0.com
              Port: 7051

    - &Org1
        Name: Org1MSP
        ID: Org1MSP
        MSPDir: ./organizations/crypto-config/peerOrganizations/org1.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org1MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org1MSP.peer')"

        AnchorPeers:
            - Host: peer0.org1.com
              Port: 8051

    - &Org2
        Name: Org2MSP
        ID: Org2MSP
        MSPDir: ./organizations/crypto-config/peerOrganizations/org2.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org2MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org2MSP.peer')"

        AnchorPeers:
            - Host: peer0.org2.com
              Port: 9051
    - &Org3
        Name: Org3MSP
        ID: Org3MSP
        MSPDir: ./organizations/crypto-config/peerOrganizations/org3.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org3MSP.admin', 'Org3MSP.peer', 'Org3MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org3MSP.admin', 'Org3MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org3MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org3MSP.peer')"

        AnchorPeers:
            - Host: peer0.org3.com
              Port: 10051

    - &Org4

        Name: Org4MSP
        ID: Org4MSP
        MSPDir: ./organizations/crypto-config/peerOrganizations/org4.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org4MSP.admin', 'Org4MSP.peer', 'Org4MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org4MSP.admin', 'Org4MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org4MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org4MSP.peer')"
        AnchorPeers:
            - Host: peer0.org4.com
              Port: 11051

Capabilities:

    Channel: &ChannelCapabilities

        V2_0: true

    Orderer: &OrdererCapabilities

        V2_0: true

    Application: &ApplicationCapabilities

        V2_0: true

Application: &ApplicationDefaults

    Organizations:

    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"

    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults

    OrdererType: etcdraft 

    Addresses:
        - orderer0.com:7050
        - orderer1.com:7050
        - orderer2.com:7050
        - orderer3.com:7050
        - orderer4.com:7050

    EtcdRaft:
        Consenters:
        - Host: orderer0.com
          Port: 7050
          ClientTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer0.com/tls/server.crt
          ServerTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer0.com/tls/server.crt

        - Host: orderer1.com
          Port: 7050
          ClientTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer1.com/tls/server.crt
          ServerTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer1.com/tls/server.crt

        - Host: orderer2.com
          Port: 7050
          ClientTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer2.com/tls/server.crt
          ServerTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer2.com/tls/server.crt

        - Host: orderer3.com
          Port: 7050
          ClientTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer3.com/tls/server.crt
          ServerTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer3.com/tls/server.crt

        - Host: orderer4.com
          Port: 7050
          ClientTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer4.com/tls/server.crt
          ServerTLSCert: ./organizations/crypto-config/ordererOrganizations/com/orderers/orderer4.com/tls/server.crt


    BatchTimeout: 1s
    BatchSize:
        MaxMessageCount: 100
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB

    Organizations:

    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
      
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"


Channel: &ChannelDefaults

    Policies:
       
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"

    
    Capabilities:
        <<: *ChannelCapabilities

Profiles:

    OrgsOrdererGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Consortiums:
            SampleConsortium:
                Organizations:
                    - *Org0
                    - *Org1
                    - *Org2
                    - *Org3
                    - *Org4


    channel:
        Consortium: SampleConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org0
                - *Org1
                - *Org2
                - *Org3
                - *Org4
            Capabilities:
                <<: *ApplicationCapabilities

